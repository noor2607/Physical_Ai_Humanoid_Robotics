[tool:pytest]
# Test discovery and execution settings
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test output and reporting
addopts =
    -v
    -s
    --tb=short
    --strict-markers
    --strict-config
    --durations=10
    --durations-min=1.0

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for multiple components
    slow: Slow running tests
    requires_ros: Tests that require ROS 2 to be installed and running
    requires_isaac: Tests that require Isaac Sim to be installed and running
    requires_llm: Tests that require LLM API access

# Filter warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning

# Code coverage settings (if using pytest-cov)
[coverage:run]
source = ../my_robot_examples/
omit =
    */test/*
    */venv/*
    */env/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.: