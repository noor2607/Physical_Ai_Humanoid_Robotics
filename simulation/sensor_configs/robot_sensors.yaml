# Sensor configuration for simulation
# This file defines realistic sensor parameters for simulation environments

# Laser Scanner (LiDAR) Configuration
laser_config:
  type: "ray"
  name: "laser_scan"
  topic: "scan"
  update_rate: 10
  ray:
    scan:
      horizontal:
        samples: 360
        resolution: 1.0
        min_angle: -3.14159  # -π
        max_angle: 3.14159   # π
    range:
      min: 0.1
      max: 30.0
      resolution: 0.01
  noise:
    type: "gaussian"
    mean: 0.0
    stddev: 0.01

# RGB Camera Configuration
camera_config:
  type: "camera"
  name: "rgb_camera"
  topic: "camera/image_raw"
  update_rate: 30
  camera:
    horizontal_fov: 1.047  # 60 degrees in radians
    image:
      width: 640
      height: 480
      format: "R8G8B8"
    clip:
      near: 0.1
      far: 100
  noise:
    type: "gaussian"
    mean: 0.0
    stddev: 0.007

# IMU Configuration
imu_config:
  type: "imu"
  name: "imu_data"
  topic: "imu"
  update_rate: 100
  imu:
    angular_velocity:
      x:
        noise:
          type: "gaussian"
          mean: 0.0
          stddev: 2e-4
      y:
        noise:
          type: "gaussian"
          mean: 0.0
          stddev: 2e-4
      z:
        noise:
          type: "gaussian"
          mean: 0.0
          stddev: 2e-4
    linear_acceleration:
      x:
        noise:
          type: "gaussian"
          mean: 0.0
          stddev: 1.7e-2
      y:
        noise:
          type: "gaussian"
          mean: 0.0
          stddev: 1.7e-2
      z:
        noise:
          type: "gaussian"
          mean: 0.0
          stddev: 1.7e-2

# GPS Configuration
gps_config:
  type: "gps"
  name: "gps_data"
  topic: "gps"
  update_rate: 1
  gps:
    noise:
      position:
        x:
          noise:
            type: "gaussian"
            mean: 0.0
            stddev: 2.0  # 2 meter accuracy
        y:
          noise:
            type: "gaussian"
            mean: 0.0
            stddev: 2.0
        z:
          noise:
            type: "gaussian"
            mean: 0.0
            stddev: 4.0

# Sonar Configuration
sonar_config:
  type: "ray"
  name: "sonar_sensor"
  topic: "sonar/range"
  update_rate: 10
  ray:
    scan:
      horizontal:
        samples: 1
        resolution: 1.0
        min_angle: 0
        max_angle: 0
    range:
      min: 0.05
      max: 4.0
      resolution: 0.01
  noise:
    type: "gaussian"
    mean: 0.0
    stddev: 0.02